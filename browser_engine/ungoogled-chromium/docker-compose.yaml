# ungoogled-chromium 内核容器
#
# 用法（在本目录下执行）：
#   docker compose up -d --build                      # 用默认版本
#   CHROMIUM_VERSION=156.0.8078.79 docker compose up -d --build
#   docker compose logs -f                            # 看启动日志
#   docker compose down
#
# 想同时跑两个版本，必须用不同的项目名，否则 compose 会认为是同一个服务、
# 把上一个容器删掉：
#   CHROMIUM_VERSION=156.0.8078.79 docker compose -p uc156 up -d --build
#   CHROMIUM_VERSION=156.0.8100.1  docker compose -p uc8100 up -d --build
#
# 版本切换的唯一来源就是 CHROMIUM_VERSION（可以写在同目录的 .env 里），
# 它同时决定三件事：COPY 哪份二进制、镜像 tag、容器名和挂载目录。

name: webweaver-kernels

services:
  ungoogled-chromium:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CHROMIUM_VERSION: ${CHROMIUM_VERSION:-156.0.8078.79}
        WITH_VNC: ${WITH_VNC:-1}
        # 海外机器把 APT_MIRROR 换成 deb.debian.org，避免绕回国内源
        BASE_IMAGE: ${BASE_IMAGE:-debian:bookworm-slim}
        APT_MIRROR: ${APT_MIRROR:-mirrors.tuna.tsinghua.edu.cn}
    image: webweaver/ungoogled-chromium:${CHROMIUM_VERSION:-156.0.8078.79}
    container_name: wv-ungoogled-${CHROMIUM_VERSION:-156.0.8078.79}

    # Chromium 会 fork 一堆子进程，没有 init 容易留僵尸
    init: true
    restart: unless-stopped

    ports:
      # 宿主机端口可改：两个版本同时跑时至少其中一个要改
      - "${CDP_HOST_PORT:-9222}:9222"     # CDP，后端 / Playwright 连这个
      - "${NOVNC_HOST_PORT:-6080}:6080"   # noVNC 网页（MODE=vnc 才有用）

    environment:
      # 默认 vnc：这个项目要人工看浏览器界面（验证码、登录、代理连通性）
      MODE: ${MODE:-vnc}
      CDP_PORT: "9222"
      START_URL: ${START_URL:-about:blank}
      SCREEN: ${SCREEN:-1920x1080x24}
      CHROME_ARGS: ${CHROME_ARGS:-}
      CHROME_NO_SANDBOX: ${CHROME_NO_SANDBOX:-1}
      TZ: ${TZ:-Asia/Shanghai}

    volumes:
      # 每个版本一个 profile 目录：同一份配置不能给两个版本共用，
      # 否则 Chromium 会因为版本不一致报 profile 需要重建
      - ./data/${CHROMIUM_VERSION:-156.0.8078.79}:/data

    # 默认 64MB 会让渲染进程随机崩溃，这是容器里跑 Chromium 最常见的坑
    shm_size: "1gb"

    # 有显卡可以放开（配合 CHROME_ARGS="--use-gl=angle"）：
    # devices:
    #   - /dev/dri:/dev/dri

    stop_grace_period: 15s
